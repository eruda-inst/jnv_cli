[project]
name = "jnv_cli"
version = "1.0.0"
description = "Curses-based terminal UI for browsing OLT slots and PONs and inspecting ONU/PON alarms on Datacom (SSH) and Fiberhome (Telnet) OLTs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "paramiko>=5.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "windows-curses>=2.4.2 ; sys_platform == 'win32'",
]

[project.scripts]
jnv_cli = "jnv_cli.main:run"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
