[project]
name = "jnv"
version = "1.0.0"
description = "It does stuff."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "paramiko>=5.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "windows-curses>=2.4.2 ; sys_platform == 'win32'",
]

[project.scripts]
jnv = "jnv.main:run"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
